name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  backend-test:
    name: Backend Tests & JaCoCo Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Run unit/integration tests and JaCoCo check
        run: ./mvnw -B clean verify

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco-coverage
          path: backend/target/site/jacoco

  frontend-test:
    name: Frontend Build & Vitest Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build production bundle
        run: npm run build

      - name: Run unit tests and coverage report
        run: npm run test:coverage

      - name: Upload Vitest coverage report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-v8-coverage
          path: frontend/coverage

  docker-build-and-publish:
    name: Full-Stack Docker Build, Smoke Test & GHCR Publish
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local Docker image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: precision-calculator:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test full-stack container
        run: |
          docker run -d --name calc-smoke -p 8080:8080 precision-calculator:ci
          trap 'docker logs calc-smoke || true; docker rm -f calc-smoke || true' EXIT

          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              break
            fi
            sleep 2
          done

          curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'
          curl -sf http://localhost:8080/ | grep -qi "Precision Calculator"
          curl -sf -X POST http://localhost:8080/api/v1/calculator/add \
            -H "Content-Type: application/json" \
            -d '{"a": 12, "b": 8}' | grep -q '"result":20'

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Push full-stack Docker image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
